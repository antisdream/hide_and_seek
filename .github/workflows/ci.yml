name: 눈치숨 검증

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 코드·멀티플레이·빌드 검증
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 전체 검증
        run: npm run verify
